name: Bug Report
description: Report something that's broken in the pipeline
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant logs. Redact tokens, keys, and credentials first.
      render: shell
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: n8n workflow / media-worker / postgres / caddy / other
    validations:
      required: false
