version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/media-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/media-worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/n8n"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
